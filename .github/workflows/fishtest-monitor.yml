name: Monitor attached Fishtest runs
on:
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Observe without updating the ledger
        type: boolean
        default: true

permissions: {}

concurrency:
  group: fishtest-ledger-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: >-
      github.repository == 'ShadyF4RR/Stockfish' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.FISHTEST_MONITOR == 'enabled'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - name: Check out trusted monitor code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refresh the fork ledger
        env:
          FISHTEST_LEDGER_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          flags=()
          if [[ "$DRY_RUN" == "true" ]]; then flags+=(--dry-run); fi
          python3 -I research-lab/fishtest/scheduled_monitor.py "${flags[@]}"
