name: Research runtime availability
on:
  workflow_dispatch:
  push:
    branches: [research/continuous-coordinator]
    paths: [.github/workflows/research-runtime-check.yml]
permissions: {}
jobs:
  runtime:
    if: github.repository == 'ShadyF4RR/Stockfish'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Inspect public model metadata and isolation tools
        run: |
          curl -fsSL --max-time 45 --max-filesize 65536 \
            https://registry.ollama.ai/v2/library/qwen2.5-coder/manifests/1.5b > "$RUNNER_TEMP/model.json"
          sha256sum "$RUNNER_TEMP/model.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads((Path(os.environ["RUNNER_TEMP"]) / "model.json").read_text())
          for layer in [d["config"], *d["layers"]]:
              print(layer["mediaType"], layer["digest"], layer["size"])
          PY
          command -v systemd-run
          command -v bwrap
