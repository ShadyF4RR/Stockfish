name: Reconcile fork promotions
on:
  schedule:
    - cron: '42 */4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-fork-promotions
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'ShadyF4RR/Stockfish' && github.ref_name == github.event.repository.default_branch && vars.RESEARCH_PROMOTION_ENABLED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ vars.RESEARCH_PROMOTION_CONTROL_SHA }}
          persist-credentials: false
      - name: Verify and enqueue or confirm fork integration PRs
        env:
          GH_TOKEN: ${{ secrets.RESEARCH_PROMOTION_TOKEN }}
          PROMOTION_CONTROL_SHA: ${{ vars.RESEARCH_PROMOTION_CONTROL_SHA }}
          RESEARCH_PROMOTION_ENABLED: ${{ vars.RESEARCH_PROMOTION_ENABLED }}
          PROMOTION_RULESET_CERTIFICATE: ${{ vars.RESEARCH_PROMOTION_RULESET_CERTIFICATE }}
        run: python3 research-lab/scripts/reconcile_promotion.py scan --write
